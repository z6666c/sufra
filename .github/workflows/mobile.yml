# بناء تطبيقات الجوال (أندرويد وآيفون) على خوادم GitHub — يُشغَّل يدوياً من تبويب Actions
# أندرويد: ملف AAB للرفع على Google Play (موقّع إذا أضفت مفتاح الرفع) + ملف APK للتجربة على جوالك
# آيفون: فحص البناء دائماً، والرفع على TestFlight إذا أضفت مفاتيح App Store Connect
name: تطبيقات الجوال
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "المنصة"
        type: choice
        options: [both, android, ios]
        default: both
      version:
        description: "رقم الإصدار للمتجر (مثل 1.0.0)"
        default: "1.0.0"
      upload_ios:
        description: "رفع نسخة آيفون إلى TestFlight (يحتاج مفاتيح آبل)"
        type: boolean
        default: true

env:
  APP_URL: ${{ vars.APP_URL }}
  APP_ID: ${{ vars.APP_ID }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/config.mjs
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: node scripts/native.mjs android "${{ inputs.version }}" "${{ github.run_number }}"
      - run: npx cap sync android
      - name: Build APK (للتجربة) و AAB (للمتجر)
        working-directory: mobile/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Sign AAB
        working-directory: mobile/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ -z "$KS" ]; then echo "::warning::ما فيه مفتاح رفع أندرويد (ANDROID_KEYSTORE_BASE64) — ملف AAB غير موقّع ولا ينفع للرفع"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "${KEY_PASS:-$KS_PASS}" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -1
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version }}-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/config.mjs
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - run: node scripts/native.mjs ios "${{ inputs.version }}" "${{ github.run_number }}"
      - run: npx cap sync ios
      - name: فحص البناء (محاكي، بدون توقيع)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: أرشفة ورفع إلى TestFlight
        if: inputs.upload_ios && env.ASC_KEY_P8 != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; echo "$ASC_KEY_P8" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" archive | tail -20
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -20
          rm -f "$KEY"
          echo "تم الرفع إلى App Store Connect — يظهر في TestFlight بعد المعالجة (10 إلى 30 دقيقة)"
      - name: تنبيه
        if: env.ASC_KEY_P8 == ''
        run: echo "::warning::ما فيه مفاتيح App Store Connect — تم فحص البناء فقط بدون رفع"
